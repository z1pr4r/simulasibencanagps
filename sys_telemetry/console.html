<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Admin Control Console</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            margin: 0;
        }

        .console-box {
            border: 1px solid #00ff66;
            padding: 30px;
            width: 100%;
            max-width: 520px;
            background-color: #050505;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            border-radius: 6px;
        }

        h3 {
            margin-top: 0;
            color: #00ff66;
            letter-spacing: 1px;
        }

        .status-info {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
        }

        .code-block {
            background: #111;
            border-left: 3px solid #00ff66;
            padding: 10px 15px;
            margin: 15px 0 25px 0;
            font-size: 0.85rem;
            color: #7ee787;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type="password"] {
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 20px;
            border-radius: 4px;
            outline: none;
        }

        input[type="password"]:focus {
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }

        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover {
            background: #00cc52;
        }
    </style>
</head>
<body>

<div class="console-box">
    <h3>[ SATELLITE MAINFRAME CONSOLE ]</h3>
    <div class="status-info">Target: GPS-01 Relativity Drift Fix</div>
    
    <div class="code-block">
        Formula: t = t_0 / sqrt(1 - v^2 / c^2)<br>
        Status: WAITING FOR AUTHENTICATION TOKEN...
    </div>

    <form onsubmit="return false;">
        <label for="pass">Masukkan Root Decrypted Token:</label>
        <input type="password" id="pass" placeholder="Password token..." autocomplete="off">
        <button onclick="authenticate()">AUTHENTICATE & APPLY PATCH</button>
    </form>
</div>

<script>
    function authenticate() {
        const input = document.getElementById('pass').value;

        // Validasi password hasil decrypt Base64
        if (input === 'Einstein1905') {
            alert('ACCESS GRANTED!\nPatch relativitas berhasil disuntikkan ke server satelit.');
            // Mengarahkan kembali ke peta utama dengan parameter patch aktif
            window.location.href = "../index.html?patched=true";
        } else {
            alert('ACCESS DENIED!\nToken salah atau belum di-decrypt.');
        }
    }
</script>

</body>
</html>
